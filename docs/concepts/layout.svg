<text x="53" y="784" font-size="16" style="fill:#e5edf7">边框只表示操作者，无人操作时白色；观察者简称在右上角，溢出用 +N。</text>
<text x="53" y="809" font-size="16" style="fill:#e5edf7">脚本 / 文件详情在主工作区，Agent 区关闭仍显示；终端与 Agent 记录均可私有回看。</text>
