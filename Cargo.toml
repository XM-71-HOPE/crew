[package]
name = "crew"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29.0"
diffy = "0.4"
eventsource-stream = "0.2"
fs2 = "0.4"
futures-util = "0.3"
libc = "0.2"
portable-pty = "0.9.0"
procfs = "0.18"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shell-escape = "0.1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
vt100 = "0.16.2"

[dev-dependencies]
axum = "0.8"
